<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  --header-h: 58px;
  --panel: rgba(255,255,255,.94);
  --line: #111;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; width:100%; height:100%; min-height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; background:#f3f4f6; color:#111; }
button,input { font:inherit; }
#app { width:100%; height:100%; min-height:100%; display:flex; flex-direction:column; }
header {
  height:var(--header-h); flex:0 0 var(--header-h);
  display:flex; align-items:center; gap:8px; padding:8px 10px;
  background:#fff; border-bottom:1px solid #ddd; z-index:20;
}
.title { font-weight:800; letter-spacing:.04em; margin-right:auto; white-space:nowrap; }
.status { font-size:12px; color:#666; white-space:nowrap; }
.iconBtn {
  border:1px solid #ccc; background:#fff; border-radius:10px; min-width:40px; height:40px;
  display:grid; place-items:center; font-size:19px; cursor:pointer;
}
.iconBtn:active { transform:scale(.97); }
#stageWrap { position:relative; flex:1; min-height:0; overflow:auto; background:#e9ecef; touch-action:pan-x pan-y; }
#stage {
  position:relative;
  width:min(100vw, 680px);
  aspect-ratio:100 / 208.28;
  margin:0 auto;
  background:white;
  overflow:hidden;
  transform-origin:top left;
  box-shadow:0 0 0 1px #ddd;
}
#floor {
  position:absolute;
  left:0; top:13.44%; width:100%; height:86.56%;
  object-fit:fill; display:block;
  user-select:none; -webkit-user-drag:none; pointer-events:none;
}
.car {
  position:absolute;
  width:24.5%;
  aspect-ratio:375 / 789;
  transform:translate(-50%,-50%);
  touch-action:none;
  cursor:grab;
  z-index:5;
  user-select:none;
}
.car.dragging { cursor:grabbing; z-index:10; }
.car img {
  position:absolute; left:50%; top:50%;
  width:210.4%; height:auto; object-fit:contain;
  transform:translate(-50%,-50%) rotate(90deg);
  transform-origin:center center;
  pointer-events:none; user-select:none; -webkit-user-drag:none;
  mix-blend-mode:normal;
  filter:contrast(1.22); /* V9: transparent PNG embedded; white background removed */
}
.car .name {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  background:rgba(255,255,255,.88); border:2px solid #111;
  border-radius:999px; padding:4px 10px; min-width:72px;
  text-align:center; font-weight:800; font-size:clamp(11px,2.8vw,17px);
  line-height:1.2; white-space:nowrap; pointer-events:none;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.car.selected .name { background:#111; color:white; }
.car.selected { outline:3px dashed rgba(0,0,0,.45); outline-offset:5px; border-radius:14px; }

#outsideZone {
  position:absolute;
  left:3%; top:1.2%; width:94%; height:10.9%;
  border:3px dashed #747474;
  border-radius:14px;
  background:rgba(248,249,250,.96);
  z-index:2;
  pointer-events:none;
}
#outsideZone .zoneTitle {
  position:absolute; left:10px; top:6px;
  font-weight:900; font-size:clamp(13px,3.3vw,18px); letter-spacing:.05em;
  background:rgba(255,255,255,.95); padding:3px 9px; border-radius:999px;
}
#outsideZone .zoneSub {
  position:absolute; right:9px; top:8px;
  font-size:clamp(9px,2.4vw,12px); color:#666;
}
.outSlot {
  position:absolute; top:56%; transform:translate(-50%,-50%);
  width:10.5%; height:82%; border:1.5px solid #c4c4c4; border-radius:12px;
  background:rgba(255,255,255,.46);
}

.outSlot::after {
  content:'外出'; position:absolute; left:50%; bottom:4px; transform:translateX(-50%);
  font-size:clamp(8px,.7vw,11px); color:#aaa; white-space:nowrap;
}

.car.parking { width:24.5%; }
.car.parking .name { transform:translate(-50%,-50%); }
.car.outside { width:8.5%; }
.car.outside .name { font-size:clamp(9px,2.4vw,13px); padding:2px 6px; min-width:48px; border-width:1.5px; }
.car.outside img { opacity:.88; }
#outsideGlow {
  position:absolute; left:1.7%; top:.5%; width:96.6%; height:12.4%;
  border-radius:18px; pointer-events:none; z-index:3; opacity:0;
  box-shadow:0 0 0 5px rgba(0,0,0,.16) inset; transition:.12s;
}
#outsideGlow.on { opacity:1; }

#hint {
  position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
  background:rgba(0,0,0,.76); color:#fff; padding:8px 14px; border-radius:999px;
  font-size:13px; z-index:15; pointer-events:none; opacity:0; transition:.2s;
}
#hint.show { opacity:1; }
#drawer {
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--panel); border-top:1px solid #ccc; box-shadow:0 -8px 30px rgba(0,0,0,.14);
  padding:12px max(12px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  transform:translateY(105%); transition:.2s ease;
}
#drawer.open { transform:translateY(0); }
.drawerHead { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.drawerHead strong { margin-right:auto; }
.carRows { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.carRow { display:flex; align-items:center; gap:7px; background:#f7f7f7; border-radius:10px; padding:7px; }
.carRow input { min-width:0; width:100%; border:1px solid #ccc; border-radius:8px; padding:8px; }
.smallBtn { border:1px solid #bbb; background:white; border-radius:8px; padding:8px 10px; white-space:nowrap; }
#mask { position:fixed; inset:0; background:rgba(0,0,0,.12); z-index:29; display:none; }
#mask.show { display:block; }
@media (max-width:700px) {
  :root { --header-h:54px; }
  html,body,#app { width:100%; height:100%; min-height:100%; }
  body { overscroll-behavior:none; }
  header { padding:7px 8px; gap:6px; width:100%; }
  .title { font-size:15px; }
  .status { display:none; }
  .iconBtn { min-width:38px; width:38px; height:38px; }
  #stageWrap { width:100%; overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #stage { width:100%; max-width:none; min-width:0; margin:0; }
  .car { width:25%; }
  .car.parking { width:25%; }
  .car.outside { width:9%; }
  .carRows { grid-template-columns:1fr; }
  #departureSheet { width:100%; }
  .depPicker { grid-template-columns:1fr 1fr; }
}
@media (max-width:380px) {
  .depPicker { grid-template-columns:1fr; }
  .depBtns { grid-template-columns:1fr; }
  #outsideZone .zoneSub { display:none; }
}

/* V15: ダブルタップは予定日時入力専用。外出中への自動移動は行わない */
.car .departure {
  position:absolute; left:50%; top:67%; transform:translate(-50%,-50%);
  background:rgba(255,255,255,.92); border:1px solid #555; border-radius:7px;
  padding:2px 5px; font-weight:700; font-size:clamp(8px,2.0vw,11px);
  line-height:1.15; white-space:nowrap; pointer-events:none; box-shadow:0 1px 3px rgba(0,0,0,.12);
}
#departureSheet {
  position:fixed; left:0; right:0; bottom:0; z-index:40; background:#fff;
  border-top:1px solid #bbb; box-shadow:0 -8px 28px rgba(0,0,0,.18);
  padding:14px 14px calc(14px + env(safe-area-inset-bottom)); transform:translateY(110%); transition:.2s ease;
}
#departureSheet.open { transform:translateY(0); }
.depHead { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.depHead strong { margin-right:auto; }
.depPicker { display:grid; grid-template-columns:1.1fr .9fr; gap:10px; }
.depField { min-width:0; }
.depLabel { display:block; font-size:12px; font-weight:800; color:#555; margin:0 0 5px 2px; }
.depInput { width:100%; min-height:48px; border:1px solid #bbb; border-radius:10px; padding:10px; font-size:17px; background:#fff; }
.depTime { appearance:auto; -webkit-appearance:menulist; }
.depBtns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.depBtns button { border:1px solid #bbb; border-radius:10px; padding:11px 6px; background:#fff; font-weight:700; }
.depBtns .primary { background:#111; color:#fff; border-color:#111; }

</style>
</head>

// ===== GitHub Pages -> GAS API 設定 =====
// GASのウェブアプリURLを下記へ貼り付けてください。
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzTgOoWzSke4BoOTvWNoZgIHpmph5cscgQY5_VoxMX0qKpDw7N0-ZJcXDxcW3LbfYms/exec';
const API_KEY = 'hirox';

function apiCall(action, payload={}) {
  return new Promise((resolve,reject)=>{
    if (!GAS_API_URL || GAS_API_URL.includes('ここにURLを記入')) {
      reject(new Error('GAS_API_URLが未設定です')); return;
    }
    const cb='hiroxCb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const timer=setTimeout(()=>{ cleanup(); reject(new Error('API timeout')); },12000);
    function cleanup(){ clearTimeout(timer); try{delete window[cb]}catch(e){}; s.remove(); }
    window[cb]=(data)=>{ cleanup(); if(data && data.ok===false) reject(new Error(data.error||'API error')); else resolve(data); };
    const params=new URLSearchParams({api:API_KEY,action,callback:cb});
    Object.entries(payload).forEach(([k,v])=>params.set(k, typeof v==='string'?v:JSON.stringify(v)));
    s.src=GAS_API_URL + (GAS_API_URL.includes('?')?'&':'?') + params.toString();
    s.onerror=()=>{ cleanup(); reject(new Error('API connection error')); };
    document.head.appendChild(s);
  });
}

function clamp(v,min,max) { return Math.max(min,Math.min(max,v)); }
function esc(s) {
  return String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
}
function setStatus(text) { statusEl.textContent = text; }
function showHint(text='車を掴んだ位置のままドラッグできます') {
  hint.textContent=text; hint.classList.add('show');
  clearTimeout(showHint.t); showHint.t=setTimeout(()=>hint.classList.remove('show'),1800);
}

function defaultFallback() {
  return {version:14,cars:[
    {id:'car1',name:'車1',x:61,y:29.02,rotation:90,zone:'parking',departureAt:'',returnAt:''},
    {id:'car2',name:'車2',x:61,y:54.99,rotation:90,zone:'parking',departureAt:'',returnAt:''},
    {id:'car3',name:'車3',x:33,y:29.02,rotation:90,zone:'parking',departureAt:'',returnAt:''},
    {id:'car4',name:'車4',x:33,y:54.99,rotation:90,zone:'parking',departureAt:'',returnAt:''}
  ]};
}

function loadState(silent=false) {
  if (!silent) setStatus('読み込み中...');
  apiCall('get').then(res => {
    if (Date.now() < localDirtyUntil && silent) return;
    state = (res && res.state) || defaultFallback();
    state.cars.forEach(c => { if (!c.zone) c.zone='parking'; if (!('departureAt' in c)) c.departureAt=''; if (!('returnAt' in c)) c.returnAt=''; });
    render();
    if (!silent) setStatus('同期済み');
  }).catch(err => {
    console.error(err);
    if (!state) { state=defaultFallback(); render(); }
    setStatus(GAS_API_URL.includes('ここにURLを記入') ? 'URL未設定' : '通信エラー');
  });
}

function scheduleSave() {
  localDirtyUntil = Date.now()+5000;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,350);
}

function saveNow() {
  if (!state) return;
  setStatus('保存中...');
  apiCall('save',{state:state}).then(r => {
    setStatus('保存済み');
    localDirtyUntil = Date.now()+1800;
  }).catch(err => {
    console.error(err);
    setStatus('保存失敗');
    showHint('保存に失敗しました');
  });
}


function formatSchedule(car) {
  const isOutside = car && car.zone==='outside';
  const label = isOutside ? '入庫' : '出庫';
  const v = isOutside ? (car.returnAt||'') : (car.departureAt||'');
  if (!v) return label+' 未設定';
  const d=new Date(v); if (isNaN(d)) return label+' '+v;
  const mm=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  const hh=String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0');
  return `${label} ${mm}/${dd} ${hh}:${mi}`;
}
function openDepartureEditor(car) {
  if (!car) return;
  editingDepartureCarId=car.id;
  const isOutside=car.zone==='outside';
  depTitle.textContent=car.name+'：'+(isOutside?'入庫予定日時':'出庫予定日時');
  setDeparturePickerValue(isOutside ? (car.returnAt||'') : (car.departureAt||''));
  departureSheet.classList.add('open'); mask.classList.add('show');
}
function closeDepartureEditor() { departureSheet.classList.remove('open'); editingDepartureCarId=null; if(!drawer.classList.contains('open')) mask.classList.remove('show'); }

function render() {
  if (!state) return;
  [...stage.querySelectorAll('.car')].forEach(el=>el.remove());

  state.cars.forEach(car => {
    const el=document.createElement('div');
    el.className='car '+(car.zone==='outside'?'outside':'parking')+(car.id===selectedId?' selected':'');
    el.dataset.id=car.id;
    el.style.left=car.x+'%';
    el.style.top=car.y+'%';
    // V7: コンテナ自体は回転させず、車画像だけを内部で90度回転。
    // これによりドラッグ座標と見た目の中心が完全に一致します。
    car.rotation = 0;
    el.style.rotate='0deg';
    el.innerHTML=`<img src="${CAR_IMAGE}" alt=""><div class="name">${esc(car.name)}</div><div class="departure">${esc(formatSchedule(car))}</div>`;

    el.addEventListener('pointerdown', ev => startDrag(ev, car, el));
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      if (Date.now() < suppressClickUntil) return;
      // シングルタップは選択だけ。予定日時入力はダブルタップで開く。
      selectedId=car.id;
      render();
      showHint(car.name+' を選択中（ダブルタップで予定入力）');
    });
    stage.appendChild(el);
  });
  renderSettings();
}


function inOutsideMagnet(p) {
  return p.x >= OUT_ZONE.x1 && p.x <= OUT_ZONE.x2 && p.y >= OUT_ZONE.y1 && p.y <= OUT_ZONE.y2;
}
function nearestFreeOutsideSlot(car, p) {
  const used = new Set();
  state.cars.forEach(c => {
    if (c.id===car.id || c.zone!=='outside') return;
    let best=0, bd=Infinity;
    OUT_SLOTS.forEach((sp,i)=>{ const d=Math.hypot(c.x-sp.x,c.y-sp.y); if(d<bd){bd=d;best=i;} });
    used.add(best);
  });
  const choices=OUT_SLOTS.map((sp,i)=>({sp,i,d:Math.hypot(p.x-sp.x,p.y-sp.y)})).sort((a,b)=>a.d-b.d);
  return (choices.find(x=>!used.has(x.i)) || choices[0]).sp;
}
function applyDrop(car, p, magnetPoint=p) {
  if (inOutsideMagnet(magnetPoint)) {
    const sp=nearestFreeOutsideSlot(car,magnetPoint);
    car.x=sp.x; car.y=sp.y; car.zone='outside'; car.rotation=0; car.departureAt=''; if (!('returnAt' in car)) car.returnAt='';
    showHint(car.name+' を外出中へ移動');
  } else {
    car.x=+p.x.toFixed(2); car.y=+p.y.toFixed(2); car.zone='parking'; car.rotation=0; car.returnAt=''; car.departureAt='';
    showHint(car.name+' を駐車場へ移動');
  }
}

function stagePoint(ev) {
  const r=stage.getBoundingClientRect();
  return {
    x: clamp((ev.clientX-r.left)/r.width*100, 3, 97),
    y: clamp((ev.clientY-r.top)/r.height*100, 1, 98.5)
  };
}

function startDrag(ev, car, el) {
  ev.preventDefault();
  ev.stopPropagation();
  selectedId=car.id;

  // 見た目の要素サイズや画像回転に依存せず、図面上の論理座標で掴んだ位置を保持。
  // これで「掴んだ瞬間に車がずれる」現象を防止します。
  const downPoint = stagePoint(ev);
  const grabOffset = {
    x: downPoint.x - Number(car.x),
    y: downPoint.y - Number(car.y)
  };

  dragging={
    id:car.id, moved:false, sx:ev.clientX, sy:ev.clientY,
    pointerId:ev.pointerId, grabOffset,
    lastPointer:downPoint
  };
  el.classList.add('dragging','selected');
  try { el.setPointerCapture(ev.pointerId); } catch(e) {}

  const move = e => {
    if (!dragging || dragging.pointerId!==e.pointerId) return;
    const pp = stagePoint(e);
    dragging.lastPointer = pp;

    const x=clamp(pp.x-dragging.grabOffset.x,3,97);
    const y=clamp(pp.y-dragging.grabOffset.y,1,98.5);
    if (Math.hypot(e.clientX-dragging.sx,e.clientY-dragging.sy)>5) dragging.moved=true;

    car.x=+x.toFixed(2); car.y=+y.toFixed(2);
    el.style.left=car.x+'%'; el.style.top=car.y+'%';
    outsideGlow.classList.toggle('on', inOutsideMagnet(pp));
  };

  const up = e => {
    if (!dragging || dragging.pointerId!==e.pointerId) return;
    try { el.releasePointerCapture(e.pointerId); } catch(x) {}
    el.removeEventListener('pointermove',move);
    el.removeEventListener('pointerup',up);
    el.removeEventListener('pointercancel',up);

    const dragInfo = dragging;
    const moved=dragInfo.moved;
    dragging=null;
    el.classList.remove('dragging');
    outsideGlow.classList.remove('on');

    if (moved) {
      // 外出判定は車体中心ではなく「指の位置」で行うため、枠の近くで自然に吸着します。
      applyDrop(car,{x:car.x,y:car.y},dragInfo.lastPointer);
      render();
      scheduleSave();
    } else {
      // V15: ダブルタップは予定日時入力専用。外出中への移動処理は一切しない。
      const now = Date.now();
      const dx = e.clientX - lastTapX;
      const dy = e.clientY - lastTapY;
      const isDoubleTap =
        lastTapCarId === car.id &&
        (now - lastTapAt) <= DOUBLE_TAP_MS &&
        Math.hypot(dx, dy) <= DOUBLE_TAP_DIST_PX;

      selectedId = car.id;

      if (isDoubleTap) {
        // 直後に発生するclickを抑止し、入力シートだけを開く。
        suppressClickUntil = now + 550;
        lastTapCarId = null;
        lastTapAt = 0;
        render();
        setTimeout(() => openDepartureEditor(car), 30);
      } else {
        lastTapCarId = car.id;
        lastTapAt = now;
        lastTapX = e.clientX;
        lastTapY = e.clientY;
        render();
      }
    }
  };
  el.addEventListener('pointermove',move);
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
}

stage.addEventListener('click', ev => {
  if (!selectedId || dragging) return;
  const car=state.cars.find(c=>c.id===selectedId);
  if (!car) return;
  const p=stagePoint(ev);
  applyDrop(car,p);
  render();
  scheduleSave();
});

function pad2(n) { return String(n).padStart(2,'0'); }
function initDepartureTimes() {
  if (depTime.options.length) return;
  for (let h=0; h<24; h++) {
    for (let m of [0,30]) {
      const v=pad2(h)+':'+pad2(m);
      const op=document.createElement('option'); op.value=v; op.textContent=v; depTime.appendChild(op);
    }
  }
}
function nextHalfHour(base=new Date()) {
  const d=new Date(base);
  d.setSeconds(0,0);
  const mins=d.getMinutes();
  if (mins===0 || mins===30) d.setMinutes(mins+30);
  else if (mins<30) d.setMinutes(30);
  else { d.setHours(d.getHours()+1); d.setMinutes(0); }
  return d;
}
function setDeparturePickerValue(value) {
  initDepartureTimes();
  let d=value ? new Date(value) : nextHalfHour();
  if (isNaN(d)) d=nextHalfHour();
  // 保存済み値が30分刻みでない旧データの場合も最寄りの30分へ丸める
  if (value) {
    const rounded=new Date(d);
    const m=rounded.getMinutes();
    rounded.setMinutes(m<15?0:m<45?30:0,0,0);
    if (m>=45) rounded.setHours(rounded.getHours()+1);
    d=rounded;
  }
  depDate.value=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  depTime.value=pad2(d.getHours())+':'+pad2(d.getMinutes());
}

function renderSettings() {
  if (!state) return;
  carRows.innerHTML = state.cars.map(c => `
    <div class="carRow">
      <input data-name="${c.id}" value="${esc(c.name)}" maxlength="16">
      <span class="smallBtn" style="pointer-events:none;color:#666">縦向き固定</span>
    </div>`).join('');

  carRows.querySelectorAll('input[data-name]').forEach(inp => {
    inp.addEventListener('change', () => {
      const c=state.cars.find(x=>x.id===inp.dataset.name);
      if (c) { c.name=inp.value.trim()||c.name; render(); scheduleSave(); }
    });
  });
}

function openDrawer() { drawer.classList.add('open'); mask.classList.add('show'); renderSettings(); }
function closeDrawer() { drawer.classList.remove('open'); mask.classList.remove('show'); }
document.getElementById('settingsBtn').onclick=openDrawer;
document.getElementById('closeDrawer').onclick=closeDrawer;
mask.onclick=()=>{ closeDrawer(); closeDepartureEditor(); };
document.getElementById('depClose').onclick=closeDepartureEditor;
document.getElementById('depSave').onclick=()=>{
  const car=state && state.cars.find(c=>c.id===editingDepartureCarId); if(!car) return;
  if (!depDate.value || !depTime.value) { showHint('日付と時刻を選択してください'); return; }
  const d=new Date(depDate.value+'T'+depTime.value+':00');
  if (isNaN(d)) { showHint('日時を確認してください'); return; }
  if (car.zone==='outside') {
    car.returnAt=d.toISOString();
    showHint('入庫予定日時を保存しました');
  } else {
    car.departureAt=d.toISOString();
    showHint('出庫予定日時を保存しました');
  }
  render(); scheduleSave(); closeDepartureEditor();
};
document.getElementById('depClear').onclick=()=>{
  const car=state && state.cars.find(c=>c.id===editingDepartureCarId); if(!car) return;
  if (car.zone==='outside') { car.returnAt=''; showHint('入庫予定を削除しました'); }
  else { car.departureAt=''; showHint('出庫予定を削除しました'); }
  render(); scheduleSave(); closeDepartureEditor();
};
document.getElementById('refreshBtn').onclick=()=>loadState(false);

initDepartureTimes();
loadState(false);
polling=setInterval(()=>loadState(true),15000);
setTimeout(()=>showHint('車をドラッグして移動できます'),700);
</script>
</body>
</html>
